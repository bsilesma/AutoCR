# =========================================================
# AutoCR Pro - Configuracion de la aplicacion
# Ajustar usuario/clave/host segun el ambiente (local o Aiven)
# =========================================================
server.port=8080

spring.application.name=autocr

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/autocr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=121106Fe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Subida de archivos (imagenes) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Internacionalizacion (para semanas posteriores) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
