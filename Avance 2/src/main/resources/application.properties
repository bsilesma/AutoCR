# =========================================================
# AutoCR Pro - Configuracion de la aplicacion
# Ajustar usuario/clave/host segun el ambiente (local o Aiven)
# =========================================================
server.port=8080

spring.application.name=autocr

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/autocr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Subida de archivos (imagenes) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Internacionalizacion (para semanas posteriores) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Inicio de sesion con Google (Avance 3) ---
# Crear credenciales OAuth 2.0 "Aplicacion web" en https://console.cloud.google.com/apis/credentials
# con Authorized redirect URI = http://localhost:8080/login/google/callback
# Luego definir las variables de entorno GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# (no escribir el secret directamente en este archivo si el repo es publico).
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/google/callback}

# --- Google Maps (Avance 3) ---
# Habilitar "Maps JavaScript API" y "Places API" en el mismo proyecto de Google Cloud.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
