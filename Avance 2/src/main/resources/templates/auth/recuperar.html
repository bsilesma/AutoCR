<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Recuperar contrasena')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>

<div class="card card-auth p-4">
    <h3 class="mb-1">Olvide mi contrasena</h3>
    <p class="text-muted">Te enviamos un codigo de 6 digitos</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/recuperar/enviar}" method="post">
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="correo" class="form-control" placeholder="correo@email.com" required/>
        </div>
        <button type="submit" class="btn btn-acr w-100">Enviar codigo</button>
    </form>

    <p class="text-center mt-3 mb-0">
        <a th:href="@{/login}">&lt;- Volver al inicio de sesion</a>
    </p>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
