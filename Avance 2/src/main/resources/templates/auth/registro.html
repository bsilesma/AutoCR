<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Crear cuenta')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>

<div class="card card-auth p-4">
    <h3 class="mb-1">Crear cuenta</h3>
    <p class="text-muted">Accede a precios y seguimiento de pedidos</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" th:value="${nombre}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="correo" class="form-control" th:value="${correo}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefono (opcional)</label>
            <input type="text" name="telefono" class="form-control" th:value="${telefono}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" name="contrasena" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-acr w-100">Crear cuenta</button>
    </form>

    <p class="text-center mt-3 mb-0">
        Ya tenes cuenta? <a th:href="@{/login}">Inicia sesion</a>
    </p>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
