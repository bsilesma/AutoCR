<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Inicio')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>
<div th:replace="~{general/fragmentos :: mensajes}"></div>

<section class="hero-autocr text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">Detailing profesional para tu <span class="text-acr">vehiculo</span></h1>
        <p class="text-white-50">Distribuidores oficiales &middot; Costa Rica. Representantes exclusivos de las mejores marcas del mundo.</p>
        <a class="btn btn-acr btn-lg mt-2" th:href="@{/productos}">Ver todos los productos</a>
    </div>
</section>

<div class="container my-5">
    <h2 class="mb-4">Marcas oficiales</h2>
    <div class="d-flex flex-wrap gap-2 mb-5">
        <span th:each="m : ${marcas}" class="badge rounded-pill text-bg-dark border border-secondary px-3 py-2" th:text="${m.nombre}">Marca</span>
    </div>

    <h2 class="mb-4">Productos destacados</h2>
    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${destacados}">
            <div class="card card-acr h-100">
                <a th:href="@{/productos/{id}(id=${p.idProducto})}">
                    <img th:src="${p.imagenUrl}" class="card-img-top w-100" th:alt="${p.nombre}"/>
                </a>
                <div class="card-body d-flex flex-column">
                    <div class="marca-tag" th:text="${p.marca.nombre}">Marca</div>
                    <a class="text-decoration-none text-white" th:href="@{/productos/{id}(id=${p.idProducto})}">
                        <p class="mb-1" th:text="${p.nombre}">Producto</p>
                    </a>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="precio" th:text="${'₡' + #numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}">₡0</span>
                        <form th:action="@{/carrito/agregar}" method="post">
                            <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                            <input type="hidden" name="cantidad" value="1"/>
                            <button type="submit" class="btn btn-acr btn-sm" th:disabled="${p.stock == 0}">+ Carrito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(destacados)}" class="text-muted">Aun no hay productos destacados configurados.</p>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
