<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Favoritos')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>
<div th:replace="~{general/fragmentos :: mensajes}"></div>

<div class="container my-4">
    <h2 class="mb-4">Mis favoritos</h2>

    <div th:if="${#lists.isEmpty(favoritos)}" class="text-center py-5">
        <p class="text-muted">Todavia no agregaste productos a favoritos.</p>
        <a class="btn btn-acr" th:href="@{/productos}">Ver productos</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(favoritos)}">
        <div class="col-6 col-md-4" th:each="f : ${favoritos}">
            <div class="card card-acr h-100 position-relative">
                <form th:action="@{/favoritos/toggle}" method="post" class="position-absolute top-0 end-0 m-2">
                    <input type="hidden" name="idProducto" th:value="${f.producto.idProducto}"/>
                    <input type="hidden" name="redirect" th:value="@{/favoritos}"/>
                    <button type="submit" class="btn btn-sm btn-fav" title="Quitar de favoritos">
                        <i class="bi bi-heart-fill"></i>
                    </button>
                </form>
                <a th:href="@{/productos/{id}(id=${f.producto.idProducto})}">
                    <img th:src="${f.producto.imagenUrl}" class="card-img-top w-100" th:alt="${f.producto.nombre}"/>
                </a>
                <div class="card-body d-flex flex-column">
                    <div class="marca-tag" th:text="${f.producto.marca.nombre}">Marca</div>
                    <a class="text-decoration-none text-white" th:href="@{/productos/{id}(id=${f.producto.idProducto})}">
                        <p class="mb-1" th:text="${f.producto.nombre}">Producto</p>
                    </a>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="precio" th:text="${'₡' + #numbers.formatDecimal(f.producto.precio, 0, 'COMMA', 0, 'POINT')}">₡0</span>
                        <form th:action="@{/carrito/agregar}" method="post">
                            <input type="hidden" name="idProducto" th:value="${f.producto.idProducto}"/>
                            <input type="hidden" name="cantidad" value="1"/>
                            <button type="submit" class="btn btn-acr btn-sm" th:disabled="${f.producto.stock == 0}">+ Carrito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
