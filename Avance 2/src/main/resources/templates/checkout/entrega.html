<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Checkout - Entrega')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>
<div th:replace="~{general/fragmentos :: mensajes}"></div>

<div class="container my-4">
    <p class="text-muted">1 Carrito &gt; <strong class="text-white">2 Entrega</strong> &gt; 3 Pago &gt; 4 Confirmacion</p>
    <h2 class="mb-4">Datos de entrega</h2>

    <div class="row">
        <div class="col-12 col-lg-8">
            <form th:action="@{/checkout/entrega}" method="post" class="card-acr rounded p-4">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" name="nombreEntrega" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" name="telefonoEntrega" class="form-control" placeholder="+506 8888-8888" required/>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Provincia</label>
                        <input type="text" name="provincia" class="form-control"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Canton</label>
                        <input type="text" name="canton" class="form-control"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Distrito</label>
                        <input type="text" name="distrito" class="form-control"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Direccion exacta</label>
                    <input type="text" name="direccionExacta" class="form-control" placeholder="100m norte del parque, casa azul..."/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nota para el repartidor (opcional)</label>
                    <input type="text" name="notaEntrega" class="form-control" placeholder="Ej: Tocar el timbre 2 veces..."/>
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">Opciones de entrega</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="metodoEntrega" id="domicilio" value="DOMICILIO" checked/>
                        <label class="form-check-label" for="domicilio">
                            Envio a domicilio - Entrega en 1-3 dias habiles. Desde C2,500, gratis en compras mayores a C30,000.
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="metodoEntrega" id="tienda" value="TIENDA"/>
                        <label class="form-check-label" for="tienda">
                            Retiro en tienda - AutoCR, Santa Barbara de Heredia, 200m norte del CCSS.
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-acr w-100">Continuar a pago -&gt;</button>
            </form>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card-acr rounded p-3">
                <h5>Tu pedido</h5>
                <div class="d-flex justify-content-between" th:each="item : ${carrito.items}">
                    <span th:text="${item.nombreProducto} + ' x' + ${item.cantidad}">Producto</span>
                    <span th:text="${'₡' + #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}">₡0</span>
                </div>
                <hr class="border-secondary"/>
                <div class="d-flex justify-content-between fw-bold">
                    <span>Total</span>
                    <span th:text="${'₡' + #numbers.formatDecimal(carrito.calcularTotal(), 0, 'COMMA', 0, 'POINT')}">₡0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
