<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Pedido confirmado')}"></head>
<body>
<nav th:replace="~{general/fragmentos :: header}"></nav>

<div class="container my-5 text-center">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
    <h2 class="mt-3">Pedido confirmado!</h2>
    <p class="text-muted">Gracias por tu compra. Aqui el resumen de tu pedido.</p>

    <div class="card-acr rounded p-4 mx-auto text-start mt-4" style="max-width: 560px;">
        <div class="d-flex justify-content-between mb-2">
            <span>Numero de orden</span>
            <strong th:text="${pedido.numeroOrden}">#ACR-0000</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Metodo de entrega</span>
            <strong th:text="${pedido.metodoEntrega}">DOMICILIO</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Metodo de pago</span>
            <strong th:text="${pedido.metodoPago}">SINPE</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span>Total pagado</span>
            <strong th:text="${'₡' + #numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')}">₡0</strong>
        </div>
        <hr class="border-secondary"/>
        <div th:each="d : ${detalle}" class="d-flex justify-content-between">
            <span th:text="${d.producto.nombre} + ' x' + ${d.cantidad}">Producto</span>
            <span th:text="${'₡' + #numbers.formatDecimal(d.subtotal, 0, 'COMMA', 0, 'POINT')}">₡0</span>
        </div>
    </div>

    <a class="btn btn-acr mt-4" th:href="@{/productos}">Seguir comprando</a>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
