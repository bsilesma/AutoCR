<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Inventario')}"></head>
<body>
<nav th:replace="~{admin/fragmentos :: headerAdmin}"></nav>
<div th:replace="~{general/fragmentos :: mensajes}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{admin/fragmentos :: sidebar('inventario')}"></div>
        <div class="col-12 col-md-9 col-lg-10 p-4">
            <h2 class="mb-4">Inventario</h2>
            <p class="text-muted">Ordenado de menor a mayor stock. Los productos en rojo estan en o por debajo del minimo de alerta (5 unidades).</p>

            <table class="table table-acr align-middle">
                <thead>
                <tr><th>Producto</th><th>Marca</th><th>Categoria</th><th>Estado</th><th>Stock actual</th><th>Ajustar</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}">Producto</td>
                    <td th:text="${p.marca.nombre}">Marca</td>
                    <td th:text="${p.categoria.nombre}">Categoria</td>
                    <td>
                        <span class="badge badge-activo" th:if="${p.activo}">Activo</span>
                        <span class="badge badge-inactivo" th:unless="${p.activo}">Inactivo</span>
                    </td>
                    <td>
                        <span th:text="${p.stock} + ' u.'" th:classappend="${p.stock le 5} ? ' badge badge-stock-bajo' : ' badge badge-activo'">0 u.</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/inventario/{id}/ajustar(id=${p.idProducto})}" method="post" class="d-flex gap-1" style="width: 160px;">
                            <input type="number" name="nuevoStock" class="form-control form-control-sm" th:value="${p.stock}" min="0" required/>
                            <button type="submit" class="btn btn-outline-acr btn-sm">Guardar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
