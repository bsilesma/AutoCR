<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: docHead('Pedidos')}"></head>
<body>
<nav th:replace="~{admin/fragmentos :: headerAdmin}"></nav>
<div th:replace="~{general/fragmentos :: mensajes}"></div>

<div class="container-fluid">
<div class="row">
<div th:replace="~{admin/fragmentos :: sidebar('pedidos')}"></div>
<main class="col-12 col-md-9 col-lg-10 p-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <a class="text-decoration-none" th:href="@{/admin/dashboard}">&larr; Panel administrativo</a>
            <h1 class="mt-2 mb-0">Pedidos</h1>
        </div>
        <form class="d-flex gap-2" th:action="@{/admin/pedidos}" method="get">
            <select class="form-select" name="estado" aria-label="Filtrar por estado">
                <option value="" th:selected="${filtroEstado == null or filtroEstado == ''}">Todos los estados</option>
                <option value="PENDIENTE" th:selected="${filtroEstado == 'PENDIENTE'}">Pendiente</option>
                <option value="PROCESANDO" th:selected="${filtroEstado == 'PROCESANDO'}">Procesando</option>
                <option value="ENTREGADO" th:selected="${filtroEstado == 'ENTREGADO'}">Entregado</option>
                <option value="CANCELADO" th:selected="${filtroEstado == 'CANCELADO'}">Cancelado</option>
            </select>
            <button class="btn btn-acr" type="submit">Filtrar</button>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-acr align-middle">
            <thead><tr><th>Orden</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th class="text-end">Total</th><th></th></tr></thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td class="fw-bold" th:text="${pedido.numeroOrden}">ACR-0000</td>
                <td th:text="${pedido.usuario.nombre}">Cliente</td>
                <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                <td><span class="badge text-bg-secondary" th:text="${pedido.estado}">Estado</span></td>
                <td class="text-end" th:text="${'₡' + #numbers.formatDecimal(pedido.total, 0, 'COMMA', 0, 'POINT')}">₡0</td>
                <td class="text-end"><a class="btn btn-outline-acr btn-sm" th:href="@{/admin/pedidos/{id}(id=${pedido.idPedido})}">Ver detalle</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="6" class="text-center text-muted py-5">No se encontraron pedidos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</div>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
